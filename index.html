<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile 💕</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff7ff, #ffe4f0);
            min-height: 100vh;
            color: #555;
        }

        /* เมนู */
        nav {
            background: white;
            padding: 18px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        nav a {
            text-decoration: none;
            color: #69bddd;
            font-weight: bold;
            margin: 0 12px;
        }

        nav a:hover {
            color: #ff8fba;
        }

        /* กล่องโปรไฟล์ */
        .profile-card {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            padding: 40px 25px;
            background: rgba(255,255,255,0.95);
            border-radius: 35px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(100,150,180,0.2);
        }

        /* รูปโปรไฟล์ */
        .profile-img {
            width: 190px;
            height: 190px;
            margin: 0 auto 20px;
            padding: 7px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9fc9, #8edcf5);
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
        }

        .bear {
            font-size: 55px;
        }

        h1 {
            color: #69c5e5;
            margin: 10px 0;
            font-size: 30px;
        }

        h2 {
            color: #ff86b4;
            margin-bottom: 20px;
        }

        .info {
            font-size: 18px;
            line-height: 2;
        }

        .name {
            color: #ff6fa8;
            font-weight: bold;
        }

        /* กล่องข้อมูล */
        .info-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 20px;
            background: #f5fbff;
            text-align: left;
            line-height: 2;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 28px;
            background: linear-gradient(135deg, #8edcf5, #ffafd0);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .decor {
            margin-top: 25px;
            font-size: 25px;
        }

        /* มือถือ */
        @media (max-width: 600px) {

            nav a {
                font-size: 13px;
                margin: 0 5px;
            }

            .profile-card {
                margin-top: 30px;
            }

            .profile-img {
                width: 160px;
                height: 160px;
            }

            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 19px;
            }

            .info {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- เมนู -->
    <nav>
        <a href="index.html">🏠 หน้าแรก</a>
        <a href="about.html">🌷 เกี่ยวกับฉัน</a>
        <a href="activities.html">🎀 กิจกรรม</a>
        <a href="works.html">🏆 ผลงาน</a>
    </nav>


    <!-- PROFILE -->
    <div class="profile-card">

        <!-- รูปของฉัน -->
        <div class="profile-img">
            <img src="profile.jpg" alt="รูปโปรไฟล์">
        </div>

        <div class="bear">🐻</div>

        <h1>สวัสดีค่ะ! 👋🏻💕</h1>

        <h2>MY PROFILE 🌷</h2>

        <p class="info">
            ฉันชื่อ <span class="name">Thanachanok Kumthong</span> 💗
            <br>
            นักเรียนชั้นมัธยมศึกษาปีที่ 6
            <br>
            โรงเรียนบ้านบึงอุตสาหกรรมนุเคราะห์
        </p>

        <a href="about.html" class="button">
            💌 รู้จักฉันมากขึ้น
        </a>

        <div class="decor">
            🩵 ☁️ 🩷 🎀 🐻 🎀 🩷 ☁️ 🩵
        </div>

    </div>

</body>
</html>
