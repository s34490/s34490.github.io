<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Portfolio 💗</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Arial", "Tahoma", sans-serif;
      background: #e9f8ff;
    }

    /* =========================
       แถบเมนู
    ========================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 14px 35px;

      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);

      box-shadow: 0 4px 18px rgba(120,180,220,0.18);

      z-index: 1000;

      animation: navDown 0.8s ease;
    }

    .nav-logo {
      color: #ee91b5;
      font-size: 20px;
      font-weight: bold;

      animation: logoFloat 2.5s ease-in-out infinite;
    }

    .nav-menu {
      display: flex;
      gap: 8px;
    }

    .nav-menu a {
      text-decoration: none;
      color: #69aeca;

      font-weight: bold;

      padding: 9px 14px;

      border-radius: 25px;

      transition: 0.3s;
    }

    .nav-menu a:hover {
      background: #ffe2ef;
      color: #ed83aa;
      transform: translateY(-3px);
    }


    /* =========================
       หน้าแรก
    ========================= */

    .home {
      min-height: 100vh;

      position: relative;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 120px 20px 50px;

      background:
        radial-gradient(circle at 10% 20%, #ffffff 0 4%, transparent 5%),
        radial-gradient(circle at 90% 80%, #ffffff 0 5%, transparent 6%),
        linear-gradient(135deg, #dff6ff, #fff0f8);
    }


    /* กล่องตรงกลาง */

    .home-content {
      position: relative;
      z-index: 5;

      width: min(700px, 92%);

      padding: 45px 30px 50px;

      background: rgba(255,255,255,0.78);

      border: 3px solid rgba(255,255,255,0.9);

      border-radius: 40px;

      box-shadow:
        0 20px 50px rgba(130,180,215,0.25);

      animation: contentAppear 1s ease;
    }


    /* =========================
       ตกแต่งด้านบน
    ========================= */

    .decor {
      font-size: 24px;
      margin-bottom: 18px;

      animation: decorMove 3s ease-in-out infinite;
    }


    /* หมี */

    .bear {
      font-size: 80px;

      margin-bottom: 8px;

      display: inline-block;

      animation: bearBounce 2s ease-in-out infinite;
    }


    /* Welcome */

    .welcome {
      color: #eca0bd;

      font-size: 17px;
      font-weight: bold;

      letter-spacing: 2px;

      margin-bottom: 18px;

      animation: sparkle 2s ease-in-out infinite;
    }


    /* หัวข้อ */

    h1 {
      color: #6baecb;

      font-size: 36px;

      line-height: 1.5;

      margin-bottom: 18px;
    }

    h1 span {
      color: #ed8eb1;

      display: inline-block;

      animation: textFloat 2.5s ease-in-out infinite;
    }


    /* ข้อความ */

    .intro {
      color: #777;

      font-size: 18px;

      margin-bottom: 25px;
    }


    /* Emoji */

    .cute-icons {
      font-size: 27px;

      letter-spacing: 7px;

      margin: 18px 0 28px;

      animation: iconsBounce 2s ease-in-out infinite;
    }


    /* ปุ่ม */

    .start-btn {
      display: inline-block;

      text-decoration: none;

      color: white;

      background: linear-gradient(
        135deg,
        #f3a1c0,
        #83cbe8
      );

      padding: 13px 28px;

      border-radius: 30px;

      font-weight: bold;

      box-shadow: 0 8px 20px rgba(150,190,220,0.3);

      transition: 0.3s;

      animation: buttonFloat 2s ease-in-out infinite;
    }

    .start-btn:hover {
      transform: scale(1.08);

      box-shadow: 0 12px 25px rgba(150,190,220,0.4);
    }


    /* =========================
       Emoji ลอยรอบเว็บ
    ========================= */

    .floating {
      position: absolute;

      font-size: 35px;

      z-index: 2;

      animation: floating 4s ease-in-out infinite;
    }

    .f1 {
      top: 25%;
      left: 8%;
    }

    .f2 {
      top: 70%;
      left: 12%;

      animation-delay: 1s;
    }

    .f3 {
      top: 25%;
      right: 9%;

      animation-delay: 2s;
    }

    .f4 {
      top: 70%;
      right: 12%;

      animation-delay: 1.5s;
    }


    /* หัวใจลอยขึ้น */

    .heart {
      position: absolute;

      bottom: -40px;

      font-size: 25px;

      opacity: 0;

      animation: heartUp 7s linear infinite;

      z-index: 1;
    }

    .heart1 {
      left: 20%;
    }

    .heart2 {
      left: 40%;
      animation-delay: 2s;
    }

    .heart3 {
      left: 65%;
      animation-delay: 4s;
    }

    .heart4 {
      left: 82%;
      animation-delay: 1s;
    }


    /* =========================
       Animation
    ========================= */

    @keyframes navDown {

      from {
        transform: translateY(-100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }

    }


    @keyframes logoFloat {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }

    }


    @keyframes contentAppear {

      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    @keyframes decorMove {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }

    }


    @keyframes bearBounce {

      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-12px) rotate(4deg);
      }

    }


    @keyframes sparkle {

      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.55;
      }

    }


    @keyframes textFloat {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }

    }


    @keyframes iconsBounce {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }

    }


    @keyframes buttonFloat {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }

    }


    @keyframes floating {

      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-25px) rotate(10deg);
      }

    }


    @keyframes heartUp {

      0% {
        transform: translateY(0) scale(0.7);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      50% {
        transform: translateY(-50vh) scale(1);
        opacity: 0.8;
      }

      100% {
        transform: translateY(-110vh) scale(1.3);
        opacity: 0;
      }

    }


    /* =========================
       มือถือ
    ========================= */

    @media (max-width: 700px) {

      .navbar {
        padding: 12px 15px;

        flex-direction: column;

        gap: 8px;
      }

      .nav-logo {
        font-size: 17px;
      }

      .nav-menu {
        gap: 3px;
      }

      .nav-menu a {
        font-size: 12px;

        padding: 7px 8px;
      }

      .home {
        padding-top: 150px;
      }

      .home-content {
        padding: 35px 18px 40px;

        border-radius: 30px;
      }

      .bear {
        font-size: 65px;
      }

      .welcome {
        font-size: 13px;
      }

      h1 {
        font-size: 26px;
      }

      .intro {
        font-size: 15px;
      }

      .cute-icons {
        font-size: 22px;
        letter-spacing: 3px;
      }

      .floating {
        font-size: 25px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       แถบเมนู
  ========================= -->

  <nav class="navbar">

    <div class="nav-logo">
      🧸 My Portfolio
    </div>

    <div class="nav-menu">

      <a href="#home">
        🏠 หน้าแรก
      </a>

      <a href="#about">

      </a>

      </a>

      <a href="#works">

      </a>

    </div>

  </nav>



  <!-- =========================

    <div class="decor">

<!-- 📸 รูปโปรไฟล์ -->
<div class="profile-photo">

      <!-- Welcome -->

      <p class="welcome">

      </p>


      <!-- หัวข้อ -->

      <h1>

        <span>

      <!-- คำโปรย -->

      <p class="intro">

      </p>


      <!-- Emoji -->

      <div class="cute-icons">

    <!-- Emoji รอบหน้า -->

    <div class="floating f1">

    <div class="floating f3">

    </div>

    <div class="heart heart1">

    </div>

    <div class="heart heart2">

    </div>

  </section>


</body>
</html>
