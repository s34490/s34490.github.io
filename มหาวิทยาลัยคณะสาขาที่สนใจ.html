<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มหาวิทยาลัยที่สนใจ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            text-align: center;
            padding: 50px;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            color: #3155d8;
        }

        h2 {
            color: #555;
            margin-top: 30px;
        }

        p {
            font-size: 20px;
        }

        .info {
            background: #eef2ff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>มหาวิทยาลัยที่ฉันสนใจ 🎓</h1>

        <div class="info">
            <h2>มหาวิทยาลัย</h2>
            <p>มหาวิทยาลัยศรีนครินทรวิโรฒ</p>
        </div>

        <div class="info">
            <h2>คณะที่สนใจ</h2>
            <p>คณะศึกษาศาสตร์</p>
        </div>

        <div class="info">
            <h2>สาขาที่สนใจ</h2>
            <p>การศึกษาปฐมวัย</p>
        </div>

    </div>

</body>
</html>
