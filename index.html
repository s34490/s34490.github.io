<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <style>
        * { box-sizing: border-box;margin: 0; padding: 0;font-family: Arial, sans-serif;}

        body {background: #f4faf6;color: #333;}

        nav { background: #1f5c42;padding: 18px 8%;display: flex;justify-content: space-between;align-items: center;}

        nav h2 { color: white;}

        nav a {color: white;text-decoration: none;font-weight: bold;}

        .profile {min-height: 85vh;display: flex;justify-content: center;align-items: center;gap: 60px;padding: 50px 10%;}

        .profile img { width: 280px;height: 350px;object-fit: cover;border-radius: 25px;}

        .text {ax-width: 550px;}

        .text h1 {font-size: 42px;color: #1f5c42;margin-bottom: 15px;}

        .text h2 {margin-bottom: 20px;}

        .text p { line-height: 1.8;margin-bottom: 25px;color: #555;}

        .btn {display: inline-block; background: #1f5c42;color: white;text-decoration: none;padding: 13px 25px;border-radius: 25px;}

        .btn:hover {background: #164832;}

        footer {background: #1f5c42;color: white;text-align: center; padding: 18px;}

        @media (max-width: 700px) {.profile {flex-direction: column;text-align: center;}

            .profile img {width: 220px;height: 280px;}

            .text h1 {font-size: 32px;}
    </style>
</head>

<body>

    <nav>
        <h2>My Portfolio 🎓</h2>
        <a href="about.html">เกี่ยวกับฉัน</a>
    </nav>

    <section class="profile">

        <img src="images/profile.jpg" alt="รูปโปรไฟล์">

        <div class="text">
            <h1>สวัสดีค่ะ 👋🏻</h1>

            <h2>ธนัชชนก ขุมทอง</h2>

            <p>
                นักเรียนชั้นมัธยมศึกษาปีที่ 6
                โรงเรียนบ้านบึงอุตสาหกรรมนุเคราะห์
            </p>

            <p>
                ยินดีต้อนรับเข้าสู่เว็บไซต์ Portfolio
                ของฉันค่ะ ✨
            </p>

            <a href="about.html" class="btn">
                🌷 เกี่ยวกับฉัน
            </a>
        </div>

    </section>

    <footer>
        My Portfolio © 2026
    </footer>

</body>
</html>
